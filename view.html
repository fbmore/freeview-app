<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Presentation · FreeView</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="/logo.png">
<!--
  The shared-presentation viewer. https://freeview.app/v/<id> (the Worker in freeview-views) renders the
  link preview and forwards here with the id in the hash. The deck comes from the Worker's /set/<id>
  (a CloudKit SharedSet record): items are assets, slides say which item or web address each slide shows,
  transition matches the app's setting, and it plays by itself when it was shared with Autoplay. Made for presenting: no download, no print.
-->
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: rgba(255,255,255,.62);
    --chip: rgba(28,28,30,.72);
    --chip-hover: rgba(58,58,60,.86);
    --hairline: rgba(255,255,255,.12);
    --ease: cubic-bezier(.2,0,0,1);
    --dur: 450ms;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; background: var(--bg); }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
    touch-action: pan-y pinch-zoom;
  }
  button { font: inherit; color: inherit; }
  @media print { body * { display: none !important; } }

  /* ── stage ── */
  #stage { position: fixed; inset: 0; overflow: hidden; }
  .slide {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden;
  }
  .slide.on { opacity: 1; visibility: visible; z-index: 1; }
  .slide { background-color: #000; }
  .slide img, .slide video {
    max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; display: block;
    -webkit-user-drag: none; pointer-events: none;
  }
  /* A Magic slide's pictures open full screen on a click (fvslide.js); without this, the click went
     through them to the slide and turned the page. */
  .slide .fv.zoomable .media img { pointer-events: auto; }
  /* A web page the app couldn't picture: its address, to open in a new tab. */
  .webcard { display: flex; flex-direction: column; align-items: center; gap: 24px; box-sizing: border-box; width: 100%; padding: 24px; text-align: center; }
  .webcard .pill { text-decoration: none; }
  .webcard .host { max-width: 100%; font-size: clamp(28px, 6vw, 56px); line-height: 1.1; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; text-wrap: balance; }
  .slide .anim { position: absolute; inset: 0; }
  .slide model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; --poster-color: transparent; background-color: #121212; }
  .slide model-viewer::part(default-poster) { background-size: contain; background-color: #121212; }
  .slide .anim canvas { width: 100% !important; height: 100% !important; display: block; }
  /* Markdown: a reading page. Short ones sit centred like a slide; long ones scroll. */
  .slide.md { --mbg: #fff; --mfg: #1c1c1e; --mmuted: #6e6e73; --mrule: rgba(0,0,0,.12); --mcode: #f2f2f7;
    background-color: var(--mbg); overflow-y: auto; align-items: flex-start; -webkit-user-select: text; user-select: text; }
  @media (prefers-color-scheme: dark) { .slide.md { --mbg: #000; --mfg: #f2f2f7; --mmuted: #98989d; --mrule: rgba(255,255,255,.16); --mcode: #1c1c1e; } }
  .doc { margin: auto; width: 100%; max-width: 720px; padding: max(56px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(96px, calc(env(safe-area-inset-bottom) + 72px)) max(24px, env(safe-area-inset-left));
    color: var(--mfg); font: 18px/1.6 -apple-system, system-ui, sans-serif; }
  .doc h1, .doc h2, .doc h3 { line-height: 1.2; text-wrap: balance; } .doc h1 { font-size: 2.2em; margin: .2em 0 .6em; }
  .doc p, .doc li { text-wrap: pretty; } .doc a { color: inherit; } .doc img { max-width: 100%; border-radius: 8px; }
  .doc pre { background: var(--mcode); padding: 14px 16px; border-radius: 10px; overflow: auto; font-size: .85em; }
  .doc code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  .doc :not(pre) > code { background: var(--mcode); padding: .1em .35em; border-radius: 5px; }
  .doc blockquote { margin: 1em 0; padding-left: 1em; border-left: 3px solid var(--mrule); color: var(--mmuted); }
  .doc hr { border: 0; border-top: 1px solid var(--mrule); margin: 2em 0; }
  .doc table { border-collapse: collapse; } .doc td, .doc th { border: 1px solid var(--mrule); padding: 6px 10px; }
  /* Tables (CSV, Excel): first row is the header, numbers line up on the right. */
  .slide.md .grid { margin: auto; max-width: 100%; overflow: auto; padding: max(48px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(96px, calc(env(safe-area-inset-bottom) + 72px)) max(20px, env(safe-area-inset-left)); color: var(--mfg);
    font: clamp(16px, 1.9vw, 30px)/1.4 -apple-system, system-ui, sans-serif; }
  .grid table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
  .grid caption { text-align: left; font-weight: 600; font-size: 1.25em; padding: 0 0 14px; text-wrap: balance; }
  .grid th { position: sticky; top: 0; background: var(--mcode); font-weight: 600; text-align: left; }
  .grid th, .grid td { padding: 9px 14px; border-bottom: 1px solid var(--mrule); white-space: nowrap; }
  .grid th:first-child { border-top-left-radius: 8px; } .grid th:last-child { border-top-right-radius: 8px; }
  .grid td.n { text-align: right; } .grid tbody tr:last-child td { border-bottom: 0; }
  .slide .loading { position: absolute; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--hairline); border-top-color: var(--muted); animation: spin .9s linear infinite; }
  .slide.ready .loading { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* transitions: classes set on #stage from the deck's setting */
  .slide { transition: background-color 300ms var(--ease); }
  #stage.t-crossfade .slide, #stage.t-fade .slide { transition: opacity var(--dur) var(--ease), visibility 0s linear var(--dur), background-color 300ms var(--ease); }
  #stage.t-crossfade .slide.on, #stage.t-fade .slide.on { transition: opacity var(--dur) var(--ease), visibility 0s; }
  #stage.t-slide .slide { transition: transform var(--dur) var(--ease), visibility 0s linear var(--dur); opacity: 1; transform: translateX(100%); }
  #stage.t-slide .slide.before { transform: translateX(-100%); }
  #stage.t-slide .slide.on { transform: none; transition: transform var(--dur) var(--ease), visibility 0s; }
  #stage.t-slide .slide.jump { transition: none; }
  #curtain { position: fixed; inset: 0; z-index: 5; opacity: 0; pointer-events: none; background: #000;
    transition: opacity 240ms var(--ease); }
  #curtain.white { background: #fff; }
  #curtain.down { opacity: 1; }

  /* ── chrome: fades out while presenting, back on movement ── */
  .chrome { transition: opacity 300ms var(--ease); }
  body.idle .chrome { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  body:not(.started) .chrome { opacity: 0; pointer-events: none; }

  #counter {
    position: fixed; z-index: 10; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%); padding: 6px 12px; border-radius: 999px;
    background: var(--chip); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--muted);
  }
  .round {
    position: fixed; z-index: 10; width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0;
    display: grid; place-items: center; cursor: pointer;
    background: var(--chip); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 0 0 1px var(--hairline), 0 4px 16px rgba(0,0,0,.28);
    transition-property: opacity, background-color, scale; transition-duration: 150ms; transition-timing-function: var(--ease);
  }
  .round:hover { background: var(--chip-hover); }
  .round:active { scale: .96; }
  .round:focus-visible, .pill:focus-visible, .chip:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .round svg { width: 18px; height: 18px; }
  .round[disabled] { opacity: .3; cursor: default; }
  #prev { left: max(16px, env(safe-area-inset-left)); top: 50%; margin-top: -22px; }
  #next { right: max(16px, env(safe-area-inset-right)); top: 50%; margin-top: -22px; }
  #prev svg { margin-left: -2px; } #next svg { margin-right: -2px; }   /* optical centring of chevrons */
  #fs { right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); }
  #sound { right: calc(max(16px, env(safe-area-inset-right)) + 54px); top: max(16px, env(safe-area-inset-top)); }
  #sound[hidden], #fs[hidden], .chip[hidden] { display: none; }
  body.started.sound-off #sound { opacity: 1; pointer-events: auto; }
  .chip {
    position: fixed; z-index: 10; left: max(16px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top));
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px;
    background: var(--chip); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 0 0 1px var(--hairline); color: var(--fg); text-decoration: none; font-size: 14px; font-weight: 600;
    max-width: calc(100vw - 160px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background-color 150ms var(--ease);
  }
  .chip:hover { background: var(--chip-hover); }
  .chip svg { width: 14px; height: 14px; flex: none; }
  /* Touch: no hover, so the arrows only show where taps can't reach the page (3D models take drags). */
  @media (hover: none) { #prev, #next { display: none; } body.web #prev, body.web #next { display: grid; } }

  /* ── cover: title + Present, over the first slide ── */
  #cover {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 24px 16px max(40px, calc(env(safe-area-inset-bottom) + 24px)); text-align: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 35%, rgba(0,0,0,.82));
    transition: opacity 400ms var(--ease);
  }
  #cover.gone { opacity: 0; pointer-events: none; }
  #cover.with-note { background: linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.88) 55%); }
  #note {
    margin: 0 0 18px; max-width: 560px; padding: 0 4px;
    font-size: clamp(16px, 2.6vw, 20px); line-height: 1.45; font-weight: 500; color: var(--fg);
    white-space: pre-line; text-wrap: pretty;
  }
  #note[hidden] { display: none; }
  #cover h1 { margin: 0 0 6px; font-size: clamp(24px, 4.6vw, 40px); line-height: 1.12; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; max-width: 760px; }
  #cover p { margin: 0 0 22px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; text-wrap: pretty; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--fg); color: #000; font-size: 17px; font-weight: 700;
    box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.35);
    transition-property: scale, opacity; transition-duration: 150ms; transition-timing-function: var(--ease);
  }
  .pill:active { scale: .96; }
  .pill svg { width: 16px; height: 16px; margin-left: -2px; }
  #cover small { display: block; margin-top: 16px; color: var(--muted); font-size: 12px; }
  #cover small a { color: inherit; }

  /* ── welcome: who it's from, their message, then Present (or the password) ── */
  #welcome { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; overflow-y: auto;
    padding: max(32px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom)); background: var(--bg);
    transition: opacity 400ms var(--ease); }
  #welcome[hidden], #welcome [hidden] { display: none !important; }
  #welcome.gone { opacity: 0; pointer-events: none; }
  #welcome .inner { display: flex; flex-direction: column; align-items: center; gap: 28px; width: min(640px, 100%); text-align: center; }
  #welcome .logo { max-height: 44px; max-width: 180px; object-fit: contain; }
  #welcome .who { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #welcome .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px rgba(255,255,255,.2);
    display: grid; place-items: center; background: rgba(255,255,255,.1); font-size: 34px; font-weight: 600; color: var(--fg); }
  #welcome .name { font-size: 17px; color: var(--muted); }
  #welcome .name b { display: block; color: var(--fg); font-weight: 600; margin-bottom: 2px; }
  #welcome .quote { margin: 0; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.4; color: rgba(255,255,255,.9); white-space: pre-line; text-wrap: pretty; }
  #welcome .quote.long { font-size: clamp(17px, 2.2vw, 20px); }
  #welcome .what { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; text-wrap: balance; }
  #welcome .what b { color: var(--fg); font-weight: 600; }
  #welcome form { display: flex; gap: 8px; width: min(340px, 100%); }
  #welcome input { flex: 1; min-width: 0; height: 52px; padding: 0 18px; border-radius: 999px; border: 0; font: inherit; font-size: 16px;
    background: rgba(255,255,255,.1); color: var(--fg); box-shadow: inset 0 0 0 1px var(--hairline); }
  #welcome input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #welcome .err { color: #ff8a80; font-size: 14px; min-height: 1.2em; margin-top: -16px; }
  #welcome .lockline { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  #welcome .lockline svg { width: 14px; height: 14px; }

  /* ── messages (loading, ended, wrong link) ── */
  #message { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px 16px; text-align: center; background: var(--bg); }
  #message[hidden] { display: none; }
  #message img.mark { width: 56px; height: 56px; border-radius: 12.5px; outline: 1px solid rgb(255 255 255 / .1); outline-offset: -1px; }
  #message h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
  #message p { margin: 0; max-width: 340px; color: var(--muted); font-size: 15px; line-height: 1.45; text-wrap: pretty; }
  #message a { color: var(--fg); }
  #message form { display: flex; gap: 8px; width: min(340px, 100%); margin-top: 6px; }
  #message input { flex: 1; min-width: 0; height: 48px; padding: 0 16px; border-radius: 999px; border: 0; font: inherit; font-size: 16px;
    background: rgba(255,255,255,.1); color: var(--fg); box-shadow: inset 0 0 0 1px var(--hairline); }
  #message input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #message form .pill { height: 48px; padding: 0 20px; font-size: 16px; }
  #message .err { color: #ff8a80; min-height: 1.2em; font-size: 14px; }
  /* Free links carry a small mark; Pro links don't. */
  #mark { position: fixed; z-index: 10; left: max(16px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 7px; border-radius: 999px; text-decoration: none;
    background: var(--chip); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); color: var(--muted);
    font-size: 12px; font-weight: 600; letter-spacing: .01em; transition: color 150ms var(--ease), opacity 300ms var(--ease); }
  #mark:hover { color: var(--fg); }
  #mark img { width: 16px; height: 16px; border-radius: 3.6px; }
  #mark[hidden] { display: none; }
  body:not(.started) #mark { opacity: 1; pointer-events: auto; z-index: 30; }   /* visible on the welcome screen too */
  /* Report a presentation (App Store 1.2): on the welcome and cover screens, before it starts. */
  #report { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
    display: none; align-items: center; height: 30px; padding: 0 12px 0 7px; border-radius: 999px; text-decoration: none;
    color: var(--muted); font-size: 12px; font-weight: 600; transition: color 150ms var(--ease); }
  #report:hover { color: var(--fg); }
  body:not(.started) #report { display: inline-flex; }

  /* ── commentary (guided tour): the presenter's camera as a layer, the slides placed by the layout ── */
  #safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #cam { position: fixed; z-index: 6; display: none; object-fit: cover; background: #000; overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,.35); opacity: 1;
    transition-property: left, top, width, height, border-radius, opacity, box-shadow; transition-duration: 400ms; transition-timing-function: var(--ease); }
  #cam.full { box-shadow: none; }
  body.tour #cam { display: block; }
  body.tour.face-behind #cam { z-index: 0; }
  body.tour #stage { z-index: 1; overflow: hidden; background: #000;
    transition-property: left, top, width, height, border-radius, opacity; transition-duration: 400ms; transition-timing-function: var(--ease); }
  body.tour.face-behind #stage { box-shadow: 0 8px 28px rgba(0,0,0,.35); }
  body.tour #counter, body.tour #prev, body.tour #next, body.tour #sound { display: none; }
  body.tour #mark { bottom: max(84px, calc(env(safe-area-inset-bottom) + 66px)); }
  #tourbar { position: fixed; z-index: 12; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom)); display: none; align-items: center; gap: 4px; height: 52px; padding: 0 6px 0 4px;
    border-radius: 999px; background: var(--chip); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 0 0 1px var(--hairline), 0 8px 24px rgba(0,0,0,.3); }
  body.tour #tourbar { display: flex; }
  body.tour.paused .chrome { opacity: 1; pointer-events: auto; }
  .tb { width: 44px; height: 44px; flex: none; border: 0; padding: 0; border-radius: 50%; background: transparent; color: var(--fg);
    display: grid; place-items: center; cursor: pointer; transition-property: background-color, scale; transition-duration: 150ms; transition-timing-function: var(--ease); }
  .tb:hover { background: rgba(255,255,255,.1); }
  .tb:active { scale: .96; }
  .tb:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
  .tb svg { width: 20px; height: 20px; }
  .tb .pause, .tb.playing .play { display: none; } .tb.playing .pause { display: block; }
  #tourbar time { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 36px; text-align: center; }
  #scrub { flex: 1; min-width: 60px; height: 44px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  #scrub::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--fg) var(--p, 0%), rgba(255,255,255,.28) var(--p, 0%)); }
  #scrub::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); }
  #scrub::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--fg); }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--fg);
    box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: scale 150ms var(--ease); }
  #scrub:active::-webkit-slider-thumb { scale: 1.15; }
  #scrub::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  #scrub:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; border-radius: 999px; }
  #layouts { position: fixed; z-index: 13; right: max(16px, env(safe-area-inset-right)); bottom: max(74px, calc(env(safe-area-inset-bottom) + 60px));
    display: flex; flex-direction: column; gap: 2px; padding: 6px; border-radius: 18px; background: var(--chip);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 0 0 1px var(--hairline), 0 12px 32px rgba(0,0,0,.4);
    opacity: 0; translate: 0 6px; pointer-events: none; transition-property: opacity, translate; transition-duration: 150ms; transition-timing-function: var(--ease); }
  #layouts.open { opacity: 1; translate: 0 0; pointer-events: auto; }
  #layouts button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px 0 10px; border: 0; border-radius: 12px;
    background: transparent; color: var(--fg); font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; white-space: nowrap;
    transition-property: background-color, scale; transition-duration: 150ms; transition-timing-function: var(--ease); }
  #layouts button:hover { background: rgba(255,255,255,.1); }
  #layouts button:active { scale: .96; }
  #layouts button svg { width: 18px; height: 18px; flex: none; }
  #layouts button .tick { width: 14px; height: 14px; margin-left: auto; opacity: 0; }
  #layouts button.on .tick { opacity: 1; }
  #layouts hr { border: 0; border-top: 1px solid var(--hairline); margin: 4px 8px; }
  #tourend { position: fixed; inset: 0; z-index: 11; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px 16px max(96px, calc(env(safe-area-inset-bottom) + 80px)); background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: opacity 300ms var(--ease); }
  #tourend.on { opacity: 1; pointer-events: auto; }
  .pill.quiet { background: var(--chip); color: var(--fg); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 0 0 1px var(--hairline); }
  #cover .actions, #welcome .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
  #cover .actions .pill, #welcome .actions .pill { white-space: nowrap; }
  #present .dur { font-weight: 600; opacity: .6; font-variant-numeric: tabular-nums; }
  #browse[hidden] { display: none; }

  body.tour .slide img { transform-origin: 0 0; will-change: transform; }
  .slide video.clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 2; display: none; }
  body.tour .slide video.clip.on { display: block; }
  @media (prefers-reduced-motion: reduce) {
    #cam, body.tour #stage { transition-duration: 1ms; }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --dur: 1ms; }
    #stage.t-slide .slide { transition: none; }
  }
</style>
</head>
<body>

<div id="cover" hidden>

    <div class="action"></div>
  </div>

  <img class="mark" src="/logo.png" alt="" width="56" height="56">

<script>
(() => {
  const API = 'https://freeview-views.fbmore.workers.dev';
  const id = decodeURIComponent(location.hash.slice(1)).trim();
  const $ = (s) => document.querySelector(s);
  const stage = $('#stage'), curtain = $('#curtain'), counter = $('#counter');
  const msg = $('#message');

  let slides = [];      // { kind: 'image'|'video'|'web', src, name }
  let index = 0, busy = false, queued = null, started = false, soundOn = false;
  // Autoplay (set when the link was shared): seconds a slide stays; a video or audio slide plays to its end.
  let autoSecs = 0, autoTimer = null;
  let nodes = [];
  let tour = null, tourOn = false;   // the commentary (presenter video + marks + layout), and whether it's playing the slides

  function show(title, text) {
    msg.hidden = false;
    msg.querySelector('h1').textContent = title;
    msg.querySelector('p').innerHTML = text || '';
  }

  if (!/^[A-Za-z0-9-]{10,100}$/.test(id)) {
    show('This link isn’t complete', 'Ask whoever shared it to send the whole link again.');
    return;
  }

  // Password-protected links (Pro) answer 401 until the right password comes with the request.
  let password = '';
  try { password = sessionStorage.getItem('fv-pw-' + id) || ''; } catch {}
  function fetchDeck() {
    fetch(`${API}/set/${encodeURIComponent(id)}`, { cache: 'no-store', headers: password ? { 'X-FV-Password': password } : {} })
      .then(async (r) => {
        if (r.status === 401) {
          const w = await r.json();
          const sd = w.sender || {};
          return showWelcome({ title: w.title, message: w.message, slides: w.slides, expiresAt: w.expiresAt, mark: w.mark,
                               name: sd.name, role: sd.role, photo: sd.photo, logo: sd.logo }, 'locked', !!password);
        }
        const data = r.ok ? await r.json() : null;
        if (!data) return ended();
        try { if (password) sessionStorage.setItem('fv-pw-' + id, password); } catch {}
        build(data.fields || {});
        // ?s=<n>: open at slide n (the app's stats screen links to each slide this way).
        const at = parseInt(new URLSearchParams(location.search).get('s'), 10);
        if (at > 1 && at <= slides.length) go(at - 1, true);
      })
      .catch(() => show('Couldn’t load the presentation', 'Check your connection and reload the page.'));
  }
  fetchDeck();

  // The welcome screen (from Foliàire): logo, sender's photo and name, their message, what the
  // presentation is, then Present, or the password for protected links.
  function showWelcome(w, mode, wrong) {
    const el = $('#welcome');
    const logo = el.querySelector('.logo');
    logo.hidden = !w.logo; if (w.logo) logo.src = w.logo;
    const who = el.querySelector('.who');
    who.hidden = !(w.name || w.photo);
    const av = el.querySelector('.avatar');
    av.innerHTML = '';
    if (w.photo) { const img = document.createElement('img'); img.className = 'avatar'; img.src = w.photo; img.alt = ''; av.replaceWith(img); }
    else { av.textContent = (w.name || '').split(/\s+/).map((p) => p[0]).join('').slice(0, 2).toUpperCase(); }
    el.querySelector('.name').innerHTML = w.name ? `<b></b>${w.role ? '<span></span>' : ''}` : '';
    if (w.name) { el.querySelector('.name b').textContent = w.name; if (w.role) el.querySelector('.name span').textContent = w.role; }
    const q = el.querySelector('.quote');
    q.hidden = !w.message; q.textContent = w.message ? `“${w.message}”` : ''; q.classList.toggle('long', (w.message || '').length > 200);
    const parts = [`<b></b>`];
    if (w.slides) parts.push(`${w.slides} slide${w.slides === 1 ? '' : 's'}`);
    if (w.expiresAt && w.expiresAt - Date.now() < 3650 * 864e5) parts.push(`until ${new Date(w.expiresAt).toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}`);
    el.querySelector('.what').innerHTML = parts.join(' · ');
    el.querySelector('.what b').textContent = w.title || 'A presentation';
    const action = el.querySelector('.action');
    action.innerHTML = '';
    if (mode === 'locked') {
      action.innerHTML = '<div class="lockline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Protected with a password</div>';
      const form = document.createElement('form');
      form.innerHTML = '<input type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button class="pill" type="submit">Open</button>';
      form.addEventListener('submit', (e) => { e.preventDefault(); password = form.querySelector('input').value; fetchDeck(); });
      const box = document.createElement('div'); box.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:14px;width:100%';
      box.appendChild(action.firstChild); box.appendChild(form);
      if (wrong) { const err = document.createElement('div'); err.className = 'err'; err.textContent = 'That password isn’t right.'; box.appendChild(err); }
      action.appendChild(box);
      setTimeout(() => form.querySelector('input').focus(), 50);
    } else {
      const btn = document.createElement('button'); btn.className = 'pill';
      btn.innerHTML = tour ? MIC + `Watch with commentary <span class="dur">${clock(tour.duration)}</span>`
        : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>Present';
      btn.addEventListener('click', tour ? beginTour : begin);
      if (tour) {
        const box = document.createElement('div'); box.className = 'actions';
        const b2 = document.createElement('button'); b2.className = 'pill quiet'; b2.textContent = 'Browse the slides';
        b2.addEventListener('click', begin);
        box.append(btn, b2); action.appendChild(box);
      } else {
        action.appendChild(btn);
      }
      setTimeout(() => btn.focus({ preventScroll: true }), 50);
    }
    $('#mark').hidden = !w.mark;
    msg.hidden = true;
    el.hidden = false;
  }

  function askPassword(title, wrong) {
    show(title || 'Password required', '');
    const p = msg.querySelector('p');
    p.textContent = 'This presentation is protected. Enter the password you were given.';
    const err = document.createElement('div'); err.className = 'err'; err.textContent = wrong ? 'That password isn’t right.' : '';
    const form = document.createElement('form');
    form.innerHTML = '<input type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button class="pill" type="submit">Open</button>';
    form.addEventListener('submit', (e) => { e.preventDefault(); password = form.querySelector('input').value; form.remove(); err.remove(); fetchDeck(); });
    msg.appendChild(form); msg.appendChild(err);
    form.querySelector('input').focus();
  }

  function ended() {
    show('This presentation has ended', 'Shared links expire after a while, or the person who shared it stopped sharing. Ask them for a new link.<br><br><a href="/">What is FreeView?</a>');
  }

  const val = (f) => (f && f.value) || null;
  function assetURL(a, name) {
    const u = a && (a.downloadURL || (a.value && a.value.downloadURL));
    return u ? u.replace('${f}', encodeURIComponent(name || 'file')) : '';
  }

  function build(f) {
    const items = val(f.items) || [];
    const types = val(f.itemTypes) || [];
    const names = val(f.itemNames) || [];
    window.__fvItems = items; window.__fvNames = names;
    let opts = {}; try { opts = JSON.parse(val(f.options) || '{}'); } catch {}
    autoSecs = Number(opts.autoplay) > 0 ? Number(opts.autoplay) : 0;
    $('#mark').hidden = !opts.mark;
    const order = val(f.slides) || items.map((_, i) => 'a:' + i);
    for (const s of order) {
      if (s.startsWith('u:')) {
        const src = s.slice(2);
        if (/^https?:\/\//i.test(src)) slides.push({ kind: 'web', src, name: new URL(src).hostname.replace(/^www\./, '') });
      } else if (s.startsWith('a:')) {
        // "a:<item>", for audio "a:<item>:p:<waveform picture item>", for a web page "a:<picture item>:u:<address>"
        const parts = s.split(':');
        const i = parseInt(parts[1], 10);
        const src = assetURL(items[i], names[i]);
        if (!src) continue;
        if (parts[2] === 'u') {
          const page = s.slice(s.indexOf(':u:') + 3);
          if (/^https?:\/\//i.test(page)) slides.push({ kind: 'web', src: page, poster: src, name: new URL(page).hostname.replace(/^www\./, '') });
          else slides.push({ kind: 'image', src, name: names[i] || '' });
        } else if (types[i] === 'audio') {
          const p = parts[2] === 'p' ? parseInt(parts[3], 10) : -1;
          slides.push({ kind: 'audio', src, poster: p >= 0 ? assetURL(items[p], names[p]) : '', name: names[i] || '' });
        } else if (types[i] === 'model') {
          const p = parts[2] === 'p' ? parseInt(parts[3], 10) : -1;
          slides.push({ kind: 'model', src, poster: p >= 0 ? assetURL(items[p], names[p]) : '', name: names[i] || '' });
        } else if (types[i] === 'markdown' || types[i] === 'lottie' || types[i] === 'table' || types[i] === 'custom') {
          slides.push({ kind: types[i], src, name: names[i] || '' });
        } else {
          slides.push({ kind: types[i] === 'video' ? 'video' : 'image', src, name: names[i] || '' });
        }
      }
    }
    if (!slides.length) return ended();

    // The commentary (alpha): the presenter's video and when each slide came on, in web slide numbers.
    try {
      const c = JSON.parse(val(f.commentary) || 'null');
      const vid = f.commentaryVideo ? assetURL(f.commentaryVideo, 'commentary.mp4') : '';
      if (c && vid && Array.isArray(c.marks) && c.marks.length) {
        tour = { ...c, video: vid };
        tour.clips = (c.clips || []).map((k) => {
          const m = /^asset:(\d+)$/.exec(k.video || ''); const i = m ? parseInt(m[1], 10) : -1;
          return { ...k, src: i >= 0 ? assetURL(items[i], names[i]) : '' };
        });
      }
    } catch {}
    if (tour) setupTour();

    const t = val(f.transition) || 'crossfade';
    stage.className = 't-' + ({ slide: 'slide', instant: 'instant', crossfade: 'crossfade', fadeBlack: 'fade', fadeWhite: 'fade' }[t] || 'crossfade');
    if (t === 'fadeWhite') curtain.classList.add('white');
    stage.dataset.curtain = t === 'fadeBlack' || t === 'fadeWhite' ? '1' : '';

    const title = (val(f.title) || 'Presentation').trim();
    document.title = `${title} · FreeView`;
    $('#title').textContent = title;
    const note = (val(f.message) || '').trim();
    if (note) { $('#note').textContent = note; $('#note').hidden = false; $('#cover').classList.add('with-note'); }
    const exp = val(f.expiresAt);
    // What's inside is the creator's business: recipients see only how long it is and until when.
    let meta = `${slides.length} slide${slides.length === 1 ? '' : 's'}`;
    if (tour) meta += ` · ${clock(tour.duration)} of commentary`;
    if (exp) meta += ` · available until ${new Date(exp).toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}`;
    $('#meta').textContent = meta;
    if (tour) {
      $('#present').innerHTML = MIC + `<span class="label">Watch with commentary</span> <span class="dur">${clock(tour.duration)}</span>`;
      $('#browse').hidden = false;
    }

    nodes = slides.map((s, i) => {
      const el = document.createElement('div');
      el.className = 'slide';
      el.dataset.n = i;
      el.setAttribute('aria-label', `Slide ${i + 1} of ${slides.length}`);
      el.innerHTML = '<div class="loading"></div>';
      stage.appendChild(el);
      return el;
    });
    if (document.fullscreenEnabled || document.webkitFullscreenEnabled) $('#fs').hidden = false;
    if (slides.some((s) => s.kind === 'video' || s.kind === 'audio')) $('#sound').hidden = false;
    updateSound();

    go(0, true);
    msg.hidden = true;
    const sd = opts.sender || {};
    const pic = (i) => (Number.isInteger(i) && items[i] ? assetURL(items[i], names[i]) : undefined);
    if (val(f.message) || sd.name || sd.photo != null || opts.locked) {
      $('#welcome').classList.remove('gone');
      showWelcome({ title, message: (val(f.message) || '').trim(), slides: slides.length, expiresAt: val(f.expiresAt), mark: !!opts.mark,
                    name: sd.name, role: sd.role, photo: pic(sd.photo), logo: pic(sd.logo) }, 'present');
    } else {
      $('#cover').hidden = false;
      $('#present').focus({ preventScroll: true });
    }

    // One view per browser session, however often it's reloaded.
    try {
      const key = 'fv-hit-' + id;
      if (!sessionStorage.getItem(key)) { sessionStorage.setItem(key, '1'); fetch(`${API}/hit/${encodeURIComponent(id)}`); }
    } catch { fetch(`${API}/hit/${encodeURIComponent(id)}`); }
  }

  // The colour around a picture that doesn't fill the screen: its own edge colour when the edge is
  // one colour (slides, scans, screenshots), white or black behind transparent artwork (logos, SVGs),
  // black for anything busier. Same rule as the app (EdgeColor.swift).
  function edgeColor(src) {
    try {
      const S = 48, c = document.createElement('canvas'); c.width = c.height = S;
      const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(src, 0, 0, S, S);
      const d = x.getImageData(0, 0, S, S).data, ring = [];
      for (let y = 0; y < S; y++) for (let i = 0; i < S; i++) if (i < 2 || y < 2 || i >= S - 2 || y >= S - 2) { const k = (y * S + i) * 4; ring.push([d[k], d[k + 1], d[k + 2], d[k + 3]]); }
      if (ring.filter((p) => p[3] < 16).length / ring.length > 0.5) {
        let s = 0, n = 0;
        for (let k = 0; k < d.length; k += 4) { if (d[k + 3] < 16) continue; s += (0.2126 * d[k] + 0.7152 * d[k + 1] + 0.0722 * d[k + 2]) / 255; n++; }
        return n ? (s / n < 0.35 ? '#fff' : '#000') : null;
      }
      const b = {};
      for (const p of ring) { if (p[3] < 16) continue; const key = (p[0] >> 4) << 8 | (p[1] >> 4) << 4 | (p[2] >> 4); (b[key] = b[key] || []).push(p); }
      let top = []; for (const k in b) if (b[k].length > top.length) top = b[k];
      if (top.length / ring.length < 0.6) return null;
      const m = (i) => Math.round(top.reduce((a, p) => a + p[i], 0) / top.length);
      return `rgb(${m(0)},${m(1)},${m(2)})`;
    } catch { return null; }   // no CORS: keep black
  }
  // Pictures load with CORS so their pixels can be read (iCloud allows freeview.app). If that ever
  // fails, the picture loads again without it: shown on black rather than not at all.
  function loadPicture(img, el, url) {
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      el.classList.add('ready');
      if (img.crossOrigin) { const c = edgeColor(img); if (c) el.style.backgroundColor = c; }
    };
    img.onerror = () => { if (img.crossOrigin) { img.removeAttribute('crossorigin'); img.src = url; } };
    img.src = url;
  }

  // Renderers for Markdown and Lottie, loaded only when a deck has them (pinned versions).
  const scripts = {};
  function loadScript(url) {
    return scripts[url] || (scripts[url] = new Promise((ok, fail) => {
      const t = document.createElement('script'); t.src = url; t.crossOrigin = 'anonymous'; t.onload = ok; t.onerror = fail; document.head.appendChild(t);
    }));
  }
  const LIBS = {
    marked: 'https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js',
    purify: 'https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js',
    lottie: 'https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js',
    fflate: 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js',
    modelViewer: 'https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js',
    qrcode: 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',
    fvslide: '/fvslide.js?v=18',   // the app's custom-slide renderer (FreeView/Support/Web/fvslide.js)
  };
  // <model-viewer> is an ES module.
  function loadModule(url) {
    return scripts[url] || (scripts[url] = new Promise((ok, fail) => {
      const t = document.createElement('script'); t.type = 'module'; t.src = url; t.onload = ok; t.onerror = fail; document.head.appendChild(t);
    }));
  }

  // Markdown from the sender is sanitised (no scripts, no handlers) before it's shown.

  function place(el, r, hidden) {
    el.style.left = r.x + 'px'; el.style.top = r.y + 'px'; el.style.width = r.w + 'px'; el.style.height = r.h + 'px';
    el.style.borderRadius = r.r + 'px'; el.style.opacity = hidden ? '0' : '1';
  }
  function applyLayout(tid, force) {
    if (!force && tid === appliedTemplate) return;
    appliedTemplate = tid;
    const t = template(tid), W = innerWidth, H = innerHeight, ins = insets();
    const face = rect(t.face, W, H, ins), scene = rect(t.scene, W, H, ins);
    place(cam, face, face.hidden); place(stage, scene, scene.hidden);
    cam.classList.toggle('full', face.w >= W - 1 && face.h >= H - 1);
    // The smaller layer sits on top (the slides over the camera when they're the inset).
    document.body.classList.toggle('face-behind', !scene.hidden && scene.w * scene.h < face.w * face.h);
    renderLayouts();
  }
  function relayout() { if (tourOn) applyLayout(appliedTemplate, true); }
  addEventListener('resize', relayout);
  function markAt(t) { let n = tour.marks[0].slide; for (const m of tour.marks) { if (m.time <= t + 0.001) n = m.slide; else break; } return n; }
  function tick() {
    if (!tourOn) return;
    const t = cam.currentTime || 0;
    const n = Math.min(slides.length - 1, Math.max(0, markAt(t)));
    if (n !== markShown) { markShown = n; if (n !== index) go(n, true); }
    applyLayout(layoutAt(t));
    replay(n, t);
    if (!scrubbing) {
      const d = cam.duration || tour.duration || 1;
      $('#scrub').value = Math.round(1000 * t / d); $('#scrub').style.setProperty('--p', (100 * t / d) + '%');
      $('#tnow').textContent = clock(t);
    }
    raf = requestAnimationFrame(tick);
  }
  function setupTour() {
    cam.src = tour.video;
    $('#tend').textContent = clock(tour.duration);
    cam.addEventListener('loadedmetadata', () => { if (cam.duration) $('#tend').textContent = clock(cam.duration); });
    cam.addEventListener('play', () => { $('#playpause').classList.add('playing'); $('#playpause').setAttribute('aria-label', 'Pause'); document.body.classList.remove('paused'); wake(); });
    cam.addEventListener('pause', () => { $('#playpause').classList.remove('playing'); $('#playpause').setAttribute('aria-label', 'Play'); document.body.classList.add('paused'); wake(); if (tourOn) replay(markShown < 0 ? index : markShown, cam.currentTime || 0); });
    cam.addEventListener('ended', () => { $('#tourend').classList.add('on'); event('tourEnd'); });
    cam.addEventListener('seeking', () => $('#tourend').classList.remove('on'));
    $('#playpause').addEventListener('click', togglePlay);
    $('#leave').addEventListener('click', leaveTour);
    $('#again').addEventListener('click', () => { $('#tourend').classList.remove('on'); seekTo(0); cam.play().catch(() => {}); });
    $('#browse-end').addEventListener('click', leaveTour);
    const scrub = $('#scrub');
    const preview = () => { const d = cam.duration || tour.duration || 1, t = scrub.value / 1000 * d; $('#tnow').textContent = clock(t); scrub.style.setProperty('--p', (100 * t / d) + '%'); };
    scrub.addEventListener('pointerdown', () => { scrubbing = true; });
    scrub.addEventListener('input', () => { scrubbing = true; preview(); });
    scrub.addEventListener('change', () => { const d = cam.duration || tour.duration || 1; seekTo(scrub.value / 1000 * d); scrubbing = false; });
    scrub.addEventListener('pointerup', () => { scrubbing = false; });
    $('#layoutbtn').addEventListener('click', (e) => { e.stopPropagation(); const m = $('#layouts'); const open = !m.classList.contains('open'); m.classList.toggle('open', open); $('#layoutbtn').setAttribute('aria-expanded', String(open)); wake(); });
    addEventListener('click', (e) => { if (!$('#layouts').contains(e.target) && e.target !== $('#layoutbtn')) $('#layouts').classList.remove('open'); });
    renderLayouts();
  }
  const ICONS = {
    bubble: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="16" cy="15" r="2.6" fill="currentColor" stroke="none"/></svg>',
    inset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><rect x="12.5" y="11.5" width="6" height="6" rx="1.5" fill="currentColor" stroke="none"/></svg>',
    split: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 12h18"/></svg>',
    faceWithSlides: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><rect x="12.5" y="6.5" width="6" height="5" rx="1.5" fill="currentColor" stroke="none"/></svg>',
    faceOnly: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="9" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>',
    slidesOnly: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/></svg>',
    recorded: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>',
  };
  const TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  function renderLayouts() {
    const menu = $('#layouts');
    const current = appliedTemplate || layoutAt(0) || 'bubble:farAlongFarAcross';
    const corner = cornerOf(template(current)) || 'farAlongFarAcross';
    const choices = [['recorded', 'As recorded', ICONS.recorded], [`bubble:${corner}`, 'Bubble', ICONS.bubble], [`inset:${corner}`, 'Inset', ICONS.inset],
      ['split', 'Split', ICONS.split], ['faceWithSlides', 'You, slides inset', ICONS.faceWithSlides], ['faceOnly', 'You only', ICONS.faceOnly], ['slidesOnly', 'Slides only', ICONS.slidesOnly]];
    // What's ticked: the choice made here, else the creator's (their chosen template, or As recorded).
    const creators = JSON.stringify(tour.layout || {}) === JSON.stringify(tour.recordedLayout || {}) ? 'recorded' : ((tour.layout || {}).baseTemplateID || current);
    const chosen = override !== null ? override : creators;
    const on = (id) => id === chosen;
    menu.innerHTML = choices.map(([id, name, icon], k) => `${k === 1 ? '<hr>' : ''}<button role="menuitemradio" data-id="${id}" aria-checked="${on(id)}" class="${on(id) ? 'on' : ''}">${icon}${name}${TICK}</button>`).join('');
    menu.querySelectorAll('button').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); override = b.dataset.id; applyLayout(layoutAt(cam.currentTime || 0), true); menu.classList.remove('open'); $('#layoutbtn').setAttribute('aria-expanded', 'false'); }));
  }
  function togglePlay() { if (!tourOn) return; if (cam.ended) { seekTo(0); cam.play().catch(() => {}); } else if (cam.paused) cam.play().catch(() => {}); else cam.pause(); }
  function seekTo(t) { cam.currentTime = Math.max(0, Math.min(t, cam.duration || tour.duration || t)); markShown = -1; tick0(); }
  function seekMark(dir) {
    const t = cam.currentTime || 0, times = tour.marks.map((m) => m.time);
    const to = dir > 0 ? times.find((x) => x > t + 0.3) : [...times].reverse().find((x) => x < t - 0.7);
    seekTo(to == null ? (dir > 0 ? cam.duration || tour.duration : 0) : to);
  }
  function tick0() { if (!tourOn) return; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
  function event(name) {
    try { const key = `fv-ev-${id}-${name}`; if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch {}
    fetch(`${API}/hit/${encodeURIComponent(id)}/e/${name}`).catch(() => {});
  }
  // What the presenter did on the slide, played back on the live slide: a video follows the
  // recorded position and play/pause, a photo zooms where they zoomed (interpolated between
  // samples), a 3D model turns to the recorded orbit. A slide with a clip (something nothing else
  // replays) shows the clip over itself for the clip's span.
  const lastOf = (kind, n, t) => {
    let last = null, next = null;
    for (const e of tour.events || []) { if (e.s !== n || e.k !== kind) continue; if (e.t <= t) last = e; else { next = e; break; } }
    return last ? { last, next } : null;
  };
  const mix = (a, b, p) => a + (b - a) * p;
  const between = (pair, t) => {
    if (!pair.next) return pair.last.v;
    const p = Math.min(1, Math.max(0, (t - pair.last.t) / Math.max(0.001, pair.next.t - pair.last.t)));
    return pair.last.v.map((a, i) => mix(a, pair.next.v[i], p));
  };
  function replay(n, t) {
    const el = nodes[n], s = slides[n];
    if (!el || !s) return;
    if (el.fvSync) {
      // Synced videos: as recorded (their play and pause), or, in a commentary made before that was
      // recorded, from the moment the slide came on.
      const pair = lastOf('video', n, t);
      if (pair) {
        const [pos, playing] = pair.last.v;
        el.fvSync.drive(pos + (playing ? t - pair.last.t : 0), playing && !cam.paused);
      } else {
        const m = tour.marks.filter((x) => x.time <= t + 0.001).pop();
        el.fvSync.drive(t - (m && m.slide === n ? m.time : 0), !cam.paused);
      }
      return;
    }
    if (s.kind === 'video') {
      const v = el.querySelector('video:not(.clip)'), pair = lastOf('video', n, t);
      if (v && pair) {
        const [pos, playing] = pair.last.v;
        const want = pos + (playing ? t - pair.last.t : 0);
        if (Math.abs(v.currentTime - want) > 0.35 && v.readyState >= 1) v.currentTime = want;
        if (playing && !cam.paused && v.paused) v.play().catch(() => {});
        if ((!playing || cam.paused) && !v.paused) v.pause();
      }
    } else if (s.kind === 'image' || (s.kind === 'web' && s.poster)) {
      const img = el.querySelector('img'), pair = lastOf('zoom', n, t);
      if (img) {
        if (!pair || !img.naturalWidth) { img.style.transform = ''; }
        else {
          const [scale, cx, cy] = between(pair, t);
          if (scale <= 1.001) { img.style.transform = ''; }
          else {
            // The picture sits letterboxed in its box: find the picture point, scale about it to the centre.
            const W = img.clientWidth, H = img.clientHeight, ar = img.naturalWidth / img.naturalHeight;
            const dw = Math.min(W, H * ar), dh = dw / ar, dx = (W - dw) / 2, dy = (H - dh) / 2;
            const px = dx + cx * dw, py = dy + cy * dh;
            let tx = W / 2 - scale * px, ty = H / 2 - scale * py;
            // Keep the picture covering the box where it can, as the app's scroll view does.
            const minX = W - scale * (dx + dw), maxX = -scale * dx, minY = H - scale * (dy + dh), maxY = -scale * dy;
            if (minX <= maxX) tx = Math.min(maxX, Math.max(minX, tx)); else tx = (W - scale * W) / 2 + scale * 0;
            if (minY <= maxY) ty = Math.min(maxY, Math.max(minY, ty)); else ty = (H - scale * H) / 2;
            img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
          }
        }
      }
    } else if (s.kind === 'custom' && window.FV && FV.focusPicture) {
      const pair = lastOf('focus', n, t);
      const want = pair ? Math.round(pair.last.v[0]) : -1;
      if (want !== el.fvFocused) { el.fvFocused = want; if (want >= 0) FV.focusPicture(el, want); else FV.unfocus(); }
      // An opened video follows the take, as the presenter had it.
      const vp = want >= 0 && FV.driveFocused ? lastOf('video', n, t) : null;
      if (vp) { const [pos, playing] = vp.last.v; FV.driveFocused(pos + (playing ? t - vp.last.t : 0), playing && !cam.paused); }
    } else if (s.kind === 'model') {
      const mv = el.querySelector('model-viewer'), pair = lastOf('orbit', n, t);
      if (mv && pair) {
        const [theta, phi, radius] = between(pair, t);
        mv.removeAttribute('auto-rotate');
        mv.cameraOrbit = `${theta}rad ${phi}rad ${Math.max(5, radius * 100)}%`;
      }
    }
    const clip = (tour.clips || []).find((c) => c.slide === n);
    if (clip && clip.src) {
      let cv = el.querySelector('video.clip');
      if (!cv) {
        cv = document.createElement('video'); cv.className = 'clip'; cv.muted = true; cv.playsInline = true; cv.preload = 'auto';
        cv.setAttribute('playsinline', ''); cv.setAttribute('disablepictureinpicture', ''); cv.src = clip.src; el.appendChild(cv);
      }
      const into = t - clip.start;
      const on = into >= 0 && into <= clip.duration + 0.25;
      cv.classList.toggle('on', on);
      if (on) {
        if (Math.abs(cv.currentTime - into) > 0.35 && cv.readyState >= 1) cv.currentTime = Math.min(into, clip.duration);
        if (!cam.paused && cv.paused && into < clip.duration) cv.play().catch(() => {});
        if ((cam.paused || into >= clip.duration) && !cv.paused) cv.pause();
      } else if (!cv.paused) cv.pause();
    }
  }
  function resetReplay() {
    if (window.FV && FV.unfocus) FV.unfocus();
    nodes.forEach((el) => {
      el.fvFocused = -1;
      el.querySelectorAll('img').forEach((img) => { img.style.transform = ''; });
      el.querySelectorAll('video.clip').forEach((cv) => { cv.pause(); cv.classList.remove('on'); });
      const mv = el.querySelector('model-viewer'); if (mv) mv.setAttribute('auto-rotate', '');
    });
  }

  function beginTour() {
    if (!tour) return begin();
    tourOn = true; tourStarted = true;
    begin();
    document.body.classList.add('tour');
    document.body.classList.remove('idle');
    updateSound();
    $('#tourend').classList.remove('on');
    applyLayout(layoutAt(0), true);
    markShown = -1;
    cam.currentTime = 0;
    cam.muted = false;
    cam.play().catch(() => {});
    tick0();
    event('tourStart');
  }
  function leaveTour() {
    if (!tourOn) return;
    tourOn = false;
    cancelAnimationFrame(raf);
    cam.pause();
    $('#layouts').classList.remove('open');
    $('#tourend').classList.remove('on');
    document.body.classList.remove('tour', 'face-behind', 'paused');
    for (const el of [cam, stage]) el.removeAttribute('style');
    resetReplay();
    appliedTemplate = null;
    updateSound();
    go(index, true);
    wake();
  }
  addEventListener('mousemove', wake, { passive: true });
  addEventListener('touchstart', wake, { passive: true });
})();
</script>
</body>
